name: slice
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install fonttools brotli pytest
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: python -m pytest tools/ -q
      - run: npm test
      - run: npm run build
      - run: python tools/verify.py dist/v1/manifest.json --sources sources/
      - run: npm run make:packages
      - run: cd examples/vite && npm install && npm run build
